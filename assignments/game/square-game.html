<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Game</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="container">
        <h1>Square Game</h1>
        
        <div class="controls">
            <div class="input-group">
                <label for="num-box">จำนวนสี่เหลี่ยม:</label>
                <input type="number" id="num-box" value="10" min="1">
            </div>
            
            <div class="input-group">
                <label for="color-box">สีสี่เหลี่ยม:</label>
                <input type="color" id="color-box" value="#ff5733">
            </div>
            
            <button id="btn-start">Start Game</button>
        </div>

        <div class="timer">
            เวลาที่เหลือ: <span id="clock">30</span> วินาที
        </div>

        <div id="game-layer">
            <!-- สี่เหลี่ยมจะถูกสร้างขึ้นที่นี่ผ่าน JavaScript -->
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
